<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Action Legends : un jeu d'action arcade en coopération, en local ou en ligne avec un lien d'invitation, jouable directement dans le navigateur.">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    :root{color-scheme:dark;--cream:#f7ebce;--muted:#a6bdb8;--gold:#f4c65d;--coral:#f87854;--ink:#08151e}
    *{box-sizing:border-box}[hidden]{display:none!important}
    html,body{height:100%}
    body{margin:0;background:radial-gradient(ellipse at 50% 0,#233f48,transparent 65%),#08121b;color:var(--cream);font:15px/1.5 system-ui,sans-serif;overflow:hidden}
    /* The page is exactly one screen: a slim bar, then the game fitted to whatever space is left. */
    main{height:100vh;height:100dvh;display:flex;flex-direction:column}
    header{flex:none;display:flex;align-items:center;gap:20px;padding:8px 16px;border-bottom:1px solid #1d3540;background:#08151ecc}
    header img{height:34px;width:auto}
    .commands{flex:1;min-width:0;color:var(--muted);font-size:12px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .commands strong{color:var(--cream)}
    #stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;container-type:size}
    #screen{position:relative;aspect-ratio:16/9;width:min(100cqw,100cqh*16/9);overflow:hidden;background:#0a1926}
    canvas{width:100%;height:100%;display:block;outline:none}
    #cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px;background:radial-gradient(ellipse at center,#234450,#07141e 80%);text-align:center;padding:24px}
    #cover img{width:min(640px,74%);max-height:30%;object-fit:contain}
    #cover p{color:var(--muted);max-width:560px;margin:0}
    button{background:var(--coral);color:#132a33;border:0;padding:15px 28px;font:800 15px system-ui;letter-spacing:.04em;cursor:pointer;box-shadow:0 4px 0 #713e32}
    button:hover{background:#ffa17a}button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:4px}button:disabled{cursor:wait;opacity:.65}
    button.secondary{background:#28434c;color:var(--cream);box-shadow:0 4px 0 #142a31}button.secondary:hover{background:#34575f}
    button.link{background:none;box-shadow:none;color:var(--gold);padding:4px 8px;font-weight:600;text-decoration:underline}
    header button{flex:none;padding:8px 14px;background:#28434c;color:var(--cream);font-size:12px;box-shadow:none}header button:hover{background:#34575f}
    .choices{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
    label.name{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px}
    input{background:#0b1d27;color:var(--cream);border:1px solid #496460;padding:10px 12px;font:600 15px system-ui;width:190px}
    #invite-title{color:var(--gold);font-weight:800;letter-spacing:.06em}
    #loading{width:min(360px,80%);height:5px;background:#36535b;display:none}#fill{height:100%;background:var(--gold);width:0;transition:width .1s linear}
    #online{flex:none;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:8px 16px;border-top:1px solid #1d3540;background:#0b1d27;font-size:13px;color:var(--muted)}
    #online strong{color:var(--gold)}#online input{flex:1 1 260px;font-size:12px;padding:6px 10px}#online button{padding:7px 14px;font-size:12px}
    #status[role=alert]{color:#ffad91;white-space:pre-wrap}a{color:var(--gold)}
    @media(max-width:900px){.commands{display:none}header{justify-content:space-between}}
    @media(max-height:560px){#cover{gap:8px;padding:12px}#tagline{display:none}button{padding:10px 20px}}
  </style>
</head>
<body>
<main>
  <header>
    <img src="logo.png" alt="Action Legends">
    <div class="commands"><strong>Q / A · D</strong> déplacer &nbsp; <strong>W / Z / ↑</strong> viser haut &nbsp; <strong>Espace</strong> sauter &nbsp; <strong>J</strong> tirer &nbsp; <strong>K</strong> spécial &nbsp; <strong>Échap</strong> pause &nbsp;·&nbsp; Manette : <strong>A / ✕</strong> pour rejoindre</div>
    <button id="fullscreen" type="button">PLEIN ÉCRAN</button>
  </header>
  <div id="stage">
    <div id="screen">
      <canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="Action Legends, zone de jeu"></canvas>
      <div id="cover">
        <img src="logo.png" alt="Action Legends">
        <p id="invite-title" hidden></p>
        <p id="tagline" hidden></p>
        <label class="name" id="name-row">Ton pseudo <input id="name" maxlength="12" autocomplete="nickname" placeholder="Joueur"></label>
        <div class="choices" id="choices">
          <button id="local" type="button">JOUER EN LOCAL</button>
          <button id="host" class="secondary" type="button" disabled>CRÉER UNE PARTIE EN LIGNE</button>
        </div>
        <div class="choices" id="join-choices" hidden>
          <button id="join" type="button" disabled>REJOINDRE LA PARTIE</button>
          <button id="local-instead" class="link" type="button">Jouer en local à la place</button>
        </div>
        <div id="loading"><div id="fill"></div></div>
        <p id="status" aria-live="polite"></p>
      </div>
    </div>
  </div>
  <div id="online" hidden>
    <span>Partie en ligne · code <strong id="code"></strong></span>
    <span id="players">Connexion…</span>
    <input id="invite" readonly aria-label="Lien d'invitation">
    <button id="copy" type="button">COPIER LE LIEN D'INVITATION</button>
    <button id="leave" class="secondary" type="button">QUITTER</button>
  </div>
</main>
<script type="module" src="net.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('unity-canvas');const status=$('status');let instance=null;
const relative=(path)=>new URL(path,document.baseURI).href;
const store={get(key){try{return localStorage.getItem(key)||'';}catch{return '';}},set(key,value){try{localStorage.setItem(key,value);}catch{}},
  hostCode(){try{return sessionStorage.getItem('al-host')||'';}catch{return '';}},setHostCode(code){try{sessionStorage.setItem('al-host',code);}catch{}}};
const invitedCode=(location.hash.match(/partie=([A-Z0-9]{4,12})/i)||[])[1]?.toUpperCase()||'';
$('name').value=store.get('al-name');
if(invitedCode){
  const resuming=store.hostCode()===invitedCode;
  $('invite-title').hidden=false;$('invite-title').textContent=resuming?'TA PARTIE EN LIGNE · CODE '+invitedCode:'INVITATION À UNE PARTIE EN LIGNE · CODE '+invitedCode;
  $('tagline').hidden=false;$('tagline').textContent=resuming?'Relance ta partie : tes amis pourront rejoindre avec le même lien.':'Choisis ton pseudo et rejoins l\'équipe.';
  $('choices').hidden=true;$('join-choices').hidden=false;$('join').textContent=resuming?'RELANCER LA PARTIE':'REJOINDRE LA PARTIE';
}
function failure(message){status.setAttribute('role','alert');status.textContent=String(message)+'\nRechargez la page pour réessayer.';for(const id of ['choices','join-choices','name-row'])$(id).hidden=true;}
function playerName(){const name=$('name').value.trim()||'Joueur';store.set('al-name',name);return name;}
function enableOnline(){$('host').disabled=false;$('join').disabled=false;}
if(window.ALNet)enableOnline();else window.addEventListener('alnet-ready',enableOnline,{once:true});

function showOnline(){
  const net=window.ALNet;$('online').hidden=false;$('code').textContent=net.code;$('invite').value=net.inviteUrl();
  net.onChange=()=>{
    const names=net.state?.players||[];
    $('players').textContent=names.length?names.length+'/4 · '+names.join(', '):net.peerCount()+' connexion(s)';
  };
  net.onChange();
}
function startGame(mode){
  if(!window.WebAssembly){failure('Ce navigateur ne prend pas en charge WebAssembly.');return;}
  if(mode!=='local'){
    const code=mode==='host'?(invitedCode||window.ALNet.newCode()):invitedCode;
    if(mode==='host'){store.setHostCode(code);history.replaceState(null,'','#partie='+code);}
    window.ALNet.start(mode,code,playerName());showOnline();
  }
  for(const id of ['choices','join-choices','name-row','invite-title'])$(id).hidden=true;
  document.getElementById('loading').style.display='block';status.textContent='Chargement du jeu…';
  const script=document.createElement('script');script.src=relative('Build/{{{ LOADER_FILENAME }}}');script.onerror=()=>failure('Impossible de charger le jeu. Vérifiez votre connexion.');
  script.onload=()=>createUnityInstance(canvas,{
    dataUrl:relative('Build/{{{ DATA_FILENAME }}}'),frameworkUrl:relative('Build/{{{ FRAMEWORK_FILENAME }}}'),
#if USE_WASM
    codeUrl:relative('Build/{{{ CODE_FILENAME }}}'),
#endif
    streamingAssetsUrl:relative('StreamingAssets'),companyName:{{{ JSON.stringify(COMPANY_NAME) }}},productName:{{{ JSON.stringify(PRODUCT_NAME) }}},productVersion:{{{ JSON.stringify(PRODUCT_VERSION) }}},
    devicePixelRatio:Math.min(window.devicePixelRatio||1,2),
    showBanner:(message,type)=>{if(type==='error')failure(message);}
  },progress=>{document.getElementById('fill').style.width=Math.round(progress*100)+'%';status.textContent='Chargement du jeu : '+Math.round(progress*100)+' %';})
    .then(value=>{instance=value;window.ALNet?.attach(value);document.getElementById('cover').hidden=true;document.getElementById('cover').style.display='none';canvas.focus();}).catch(failure);
  document.body.appendChild(script);
}
$('local').addEventListener('click',()=>startGame('local'));
$('local-instead').addEventListener('click',()=>{history.replaceState(null,'',location.pathname+location.search);startGame('local');});
$('host').addEventListener('click',()=>startGame('host'));
$('join').addEventListener('click',()=>startGame(store.hostCode()===invitedCode?'host':'guest'));
$('copy').addEventListener('click',async()=>{
  $('invite').select();
  try{await navigator.clipboard.writeText($('invite').value);$('copy').textContent='LIEN COPIÉ !';}
  catch{$('copy').textContent='COPIE MANUELLE : CTRL+C';}
  setTimeout(()=>{$('copy').textContent='COPIER LE LIEN D\'INVITATION';},2200);
});
$('leave').addEventListener('click',()=>{location.href=location.pathname+location.search;});
document.getElementById('fullscreen').addEventListener('click',()=>{if(instance)instance.SetFullscreen(1);else document.getElementById('screen').requestFullscreen?.().catch(()=>{});});
canvas.addEventListener('pointerdown',()=>canvas.focus());
window.addEventListener('keydown',event=>{if(document.activeElement===canvas&&['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.code))event.preventDefault();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&instance)instance.SendMessage('Action Legends','PauseFromBrowser');});
</script>
</body>
</html>
